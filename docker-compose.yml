# Local PostgreSQL for development and tests.
# Creates two databases: mytraders_dev and mytraders_test (see docker/postgres-init.sql).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mytraders
      POSTGRES_PASSWORD: mytraders
      POSTGRES_DB: mytraders_dev
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata:
